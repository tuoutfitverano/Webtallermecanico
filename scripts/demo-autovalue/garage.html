<!doctype html>
<!--
  Garaje del taller demo (AutoValue), visto de lado para que el coche quede
  aparcado de perfil delante de la pared del fondo. Dibujo propio inspirado en
  la referencia del propietario (paredes negras, techo de LED hexagonal,
  puerta de garaje seccional, armarios de acero, panel perforado, suelo de hormigón pulido): no usa su foto.
  Lo convierte en imagen scripts/demo-autovalue/render-garage.mjs.

  Coordenadas en «px de imagen» de 1280×2560 (se dibuja a escala ?s=, p. ej.
  3 → 3840×7680): la franja central (y 920–1640) coincide con los fotogramas
  del coche. Perspectiva de un punto.
-->
<meta charset="utf-8">
<canvas id="c"></canvas>
<script>
const S = Number(new URLSearchParams(location.search).get('s') || 1.5);
const W = 1280, H = 2560;
const c = document.getElementById('c');
c.width = Math.round(W * S); c.height = Math.round(H * S);
const g = c.getContext('2d');
g.scale(S, S);

// ---- Cámara (metros): el coche (4,75 m ≈ 1233 px) a ~2,3 m; la pared del fondo a 7,6 m.
const VX = 640, VY = 1239, F = 600;
const WALL_Z = 7.6, FLOOR_Y = -1.1, CEIL_Y = 1.5, HALF_W = 6, NEAR = 0.25;
const P = (x, y, z) => [VX + F * x / z, VY - F * y / z];
const [, WALL_TOP] = P(0, CEIL_Y, WALL_Z);
const [, WALL_BOTTOM] = P(0, FLOOR_Y, WALL_Z);

// Semilla fija: el dibujo sale siempre igual.
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

function layer() {
  const t = document.createElement('canvas');
  t.width = c.width; t.height = c.height;
  const k = t.getContext('2d');
  k.scale(S, S);
  return [t, k];
}
function poly(k, points, fill) {
  k.beginPath();
  points.forEach(([x, y], i) => (i ? k.lineTo(x, y) : k.moveTo(x, y)));
  k.closePath();
  k.fillStyle = fill;
  k.fill();
}
function lin(k, x0, y0, x1, y1, stops) {
  const gr = k.createLinearGradient(x0, y0, x1, y1);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  return gr;
}
function wallRect(k, x0, y0, x1, y1) {
  const [a, b] = P(x0, y1, WALL_Z), [cc, d] = P(x1, y0, WALL_Z);
  return [a, b, cc - a, d - b];
}
function blit(dst, src, { blur = 0, alpha = 1, op = 'source-over' } = {}) {
  dst.save();
  dst.setTransform(1, 0, 0, 1, 0, 0);
  dst.filter = blur ? `blur(${blur * S}px)` : 'none';
  dst.globalAlpha = alpha;
  dst.globalCompositeOperation = op;
  dst.drawImage(src, 0, 0);
  dst.restore();
}
const floorPoly = [P(-HALF_W, FLOOR_Y, WALL_Z), P(HALF_W, FLOOR_Y, WALL_Z), P(HALF_W, FLOOR_Y, NEAR), P(-HALF_W, FLOOR_Y, NEAR)];

// =====================================================================
// 1. Escena de arriba: techo, paredes y muebles (sin suelo)
// =====================================================================
const [scene, s] = layer();
s.fillStyle = '#000'; s.fillRect(0, 0, W, H);

// Techo gris claro, iluminado por los propios LED (más claro cerca de la rejilla)
poly(s, [P(-HALF_W, CEIL_Y, WALL_Z), P(HALF_W, CEIL_Y, WALL_Z), P(HALF_W, CEIL_Y, NEAR), P(-HALF_W, CEIL_Y, NEAR)],
  lin(s, 0, WALL_TOP, 0, 0, [[0, '#4a4b4d'], [0.25, '#6c6e71'], [0.6, '#55575a'], [1, '#1c1c1d']]));

// Paredes laterales negras
for (const side of [-1, 1]) {
  const [ex] = P(side * HALF_W, 0, WALL_Z);
  poly(s, [P(side * HALF_W, CEIL_Y, WALL_Z), P(side * HALF_W, FLOOR_Y, WALL_Z), P(side * HALF_W, FLOOR_Y, NEAR), P(side * HALF_W, CEIL_Y, NEAR)],
    lin(s, side < 0 ? 0 : W, 0, ex, 0, [[0, '#050505'], [1, '#141415']]));
}

// Pared del fondo: negra mate, con la luz del techo bañando la parte alta
{
  const [x, y, w, h] = wallRect(s, -HALF_W, FLOOR_Y, HALF_W, CEIL_Y);
  s.fillStyle = lin(s, 0, y, 0, y + h, [[0, '#2b2c2e'], [0.18, '#18191a'], [0.6, '#0f0f10'], [1, '#0b0b0c']]);
  s.fillRect(x, y, w, h);
}

function steel(k, x, y, w, h, base = 58) {
  k.fillStyle = lin(k, 0, y, 0, y + h, [[0, `rgb(${base + 22},${base + 24},${base + 27})`], [0.5, `rgb(${base},${base + 2},${base + 5})`], [1, `rgb(${base - 18},${base - 17},${base - 15})`]]);
  k.fillRect(x, y, w, h);
  k.fillStyle = 'rgba(255,255,255,.10)'; k.fillRect(x, y, w, 1.2);
  k.fillStyle = 'rgba(0,0,0,.55)'; k.fillRect(x, y + h - 1.2, w, 1.2);
  k.fillStyle = 'rgba(0,0,0,.4)'; k.fillRect(x, y, 1, h); k.fillRect(x + w - 1, y, 1, h);
}
function handle(k, x, y, w) {
  k.fillStyle = lin(k, 0, y, 0, y + 3, [[0, '#e9ebee'], [1, '#7d8186']]);
  k.fillRect(x, y, w, 2.6);
}
// Puerta de garaje seccional (izquierda): paneles horizontales de acero con
// nervios, fila de ventanillas arriba, guías laterales y burlete negro abajo.
{
  const [fx, fy, fw, fh] = wallRect(s, -5.75, FLOOR_Y, -3.35, 1.2);   // marco
  s.fillStyle = '#060606'; s.fillRect(fx, fy, fw, fh);
  const [x, y, w, h] = wallRect(s, -5.65, FLOOR_Y, -3.45, 1.12);      // hoja
  const panels = 5, ph = h / panels;
  for (let i = 0; i < panels; i++) {
    const py = y + i * ph;
    s.fillStyle = lin(s, 0, py, 0, py + ph, [[0, '#3d4044'], [0.12, '#55595e'], [0.5, '#45484c'], [0.88, '#34373a'], [1, '#1f2123']]);
    s.fillRect(x, py, w, ph);
    // Nervios horizontales
    for (const r of [0.33, 0.66]) {
      s.fillStyle = 'rgba(0,0,0,.35)'; s.fillRect(x, py + ph * r, w, 0.9);
      s.fillStyle = 'rgba(255,255,255,.09)'; s.fillRect(x, py + ph * r + 0.9, w, 0.6);
    }
    // Junta entre paneles
    s.fillStyle = 'rgba(0,0,0,.7)'; s.fillRect(x, py + ph - 0.8, w, 0.8);
  }
  // Ventanillas en el panel superior
  for (let k = 0; k < 4; k++) {
    const wx = x + w * (0.08 + k * 0.23), wy = y + ph * 0.28;
    s.fillStyle = lin(s, wx, wy, wx + w * 0.16, wy + ph * 0.44, [[0, '#0b0c0d'], [0.6, '#16181a'], [1, '#2a2d30']]);
    s.fillRect(wx, wy, w * 0.16, ph * 0.44);
    s.strokeStyle = 'rgba(255,255,255,.12)'; s.lineWidth = 0.6; s.strokeRect(wx, wy, w * 0.16, ph * 0.44);
  }
  // Tirador y burlete
  handle(s, x + w * 0.46, y + h - ph * 0.55, w * 0.08);
  s.fillStyle = '#050505'; s.fillRect(x, y + h - 1.6, w, 1.6);
  // Guías laterales
  s.fillStyle = lin(s, x - 3, 0, x, 0, [[0, '#1a1b1d'], [1, '#3a3d40']]); s.fillRect(x - 3, y, 3, h);
  s.fillStyle = lin(s, x + w, 0, x + w + 3, 0, [[0, '#3a3d40'], [1, '#1a1b1d']]); s.fillRect(x + w, y, 3, h);
  // Luz del techo cayendo sobre la puerta
  s.fillStyle = lin(s, 0, y, 0, y + h, [[0, 'rgba(255,255,255,.10)'], [0.5, 'rgba(255,255,255,0)'], [1, 'rgba(0,0,0,.25)']]);
  s.fillRect(x, y, w, h);
}

// Puesto de trabajo (centro): armarios de acero gris, encimera inox, panel perforado
{
  const BENCH = [-2.9, 2.9];
  // Armarios altos
  for (const [a, b] of [[-3.6, -2.95], [2.95, 3.6]]) {
    const [x, y, w, h] = wallRect(s, a, FLOOR_Y + 0.04, b, 0.98);
    steel(s, x, y, w, h, 64);
    s.fillStyle = 'rgba(0,0,0,.5)'; s.fillRect(x + w / 2 - 0.5, y + 2, 1, h - 4);
    handle(s, x + w / 2 - 6, y + h * 0.45, 4); handle(s, x + w / 2 + 2, y + h * 0.45, 4);
  }
  // Altillos
  const nTop = 4;
  for (let i = 0; i < nTop; i++) {
    const a = BENCH[0] + (i * (BENCH[1] - BENCH[0])) / nTop, b = a + (BENCH[1] - BENCH[0]) / nTop;
    const [x, y, w, h] = wallRect(s, a + 0.01, 0.62, b - 0.01, 0.98);
    steel(s, x, y, w, h, 60);
    handle(s, x + w * 0.3, y + h - 7, w * 0.4);
  }
  // Panel perforado claro, iluminado por la tira LED de debajo de los altillos
  {
    const [x, y, w, h] = wallRect(s, BENCH[0], -0.06, BENCH[1], 0.6);
    s.fillStyle = '#9c9fa3'; s.fillRect(x, y, w, h);
    s.fillStyle = 'rgba(30,30,32,.55)';
    for (let px = x + 3; px < x + w - 2; px += 4.2) for (let py = y + 3; py < y + h - 2; py += 4.2) s.fillRect(px, py, 0.9, 0.9);
    // Herramientas colgadas (llaves, alicates, destornilladores)
    for (let i = 0; i < 26; i++) {
      const tx = x + 8 + i * (w - 16) / 25, top = y + h * (0.22 + (i % 3) * 0.04);
      const len = h * (0.28 + rnd() * 0.3), red = i % 7 === 3;
      s.fillStyle = red ? '#9b1c1c' : i % 2 ? '#2a2b2d' : '#4b4e52';
      s.fillRect(tx, top, 1.6 + (i % 3) * 0.6, len);
      s.fillRect(tx - 1.6, top - 1.6, 4.8 + (i % 3) * 0.6, 3);
    }
    // Luz de la tira LED: muy clara arriba, cae hacia abajo
    s.fillStyle = lin(s, 0, y, 0, y + h, [[0, 'rgba(255,255,255,.45)'], [0.35, 'rgba(255,255,255,.08)'], [1, 'rgba(0,0,0,.25)']]);
    s.fillRect(x, y, w, h);
    s.save(); s.shadowColor = 'rgba(255,255,255,.95)'; s.shadowBlur = 10;
    s.fillStyle = '#ffffff'; s.fillRect(x, y - 1.6, w, 1.6); s.restore();
  }
  // Encimera de acero inoxidable
  {
    const [x, y, w, h] = wallRect(s, BENCH[0] - 0.03, -0.12, BENCH[1] + 0.03, -0.06);
    s.fillStyle = lin(s, 0, y, 0, y + h, [[0, '#f2f3f5'], [0.4, '#b7bbc0'], [1, '#5d6166']]);
    s.fillRect(x, y, w, h);
  }
  // Cajoneras
  const units = [[BENCH[0], -1.0], [-1.0, 1.0], [1.0, BENCH[1]]];
  units.forEach(([a, b], u) => {
    const [x, y, w, h] = wallRect(s, a + 0.02, FLOOR_Y + 0.1, b - 0.02, -0.12);
    steel(s, x, y, w, h, 56);
    const n = u === 1 ? 2 : 7;
    for (let i = 0; i < n; i++) {
      const dy = y + (i * h) / n;
      s.fillStyle = 'rgba(0,0,0,.6)'; s.fillRect(x + 2, dy, w - 4, 1);
      if (u === 1) { s.fillStyle = 'rgba(0,0,0,.6)'; s.fillRect(x + w / 2, y + 2, 1, h - 4); }
      handle(s, x + w * 0.15, dy + (h / n) * 0.3, u === 1 ? w * 0.25 : w * 0.7);
      if (u === 1) handle(s, x + w * 0.6, dy + (h / n) * 0.3, w * 0.25);
    }
    // Zócalo negro
    const [zx, zy, zw, zh] = wallRect(s, a + 0.02, FLOOR_Y, b - 0.02, FLOOR_Y + 0.1);
    s.fillStyle = '#060606'; s.fillRect(zx, zy, zw, zh);
  });
}

// Derecha: radiador, estante con vitrinas iluminadas y un póster
{
  const [x, y, w, h] = wallRect(s, 4.0, -0.95, 5.4, -0.3);
  s.fillStyle = '#1d1e20'; s.fillRect(x, y, w, h);
  for (let px = x + 2; px < x + w - 1; px += 3) {
    s.fillStyle = lin(s, px, 0, px + 2.4, 0, [[0, '#3a3c3f'], [1, '#121213']]);
    s.fillRect(px, y + 2, 2.4, h - 4);
  }
  for (const sy of [0.55, 0.2]) {
    const [bx, by, bw] = wallRect(s, 4.0, sy, 5.5, sy + 0.035);
    s.fillStyle = '#050505'; s.fillRect(bx, by, bw, 3);
    for (let i = 0; i < 6; i++) {
      const cx = bx + 4 + i * (bw - 8) / 6;
      s.fillStyle = 'rgba(255,255,255,.10)'; s.fillRect(cx, by - 17, (bw - 8) / 6 - 3, 17);
      s.fillStyle = 'rgba(255,255,255,.35)'; s.fillRect(cx, by - 17, (bw - 8) / 6 - 3, 0.8);
      s.fillStyle = i % 3 === 0 ? '#8e1d1d' : '#c9ccd0'; s.fillRect(cx + 3, by - 6, (bw - 8) / 6 - 9, 4);
    }
  }
  const [px, py, pw, ph] = wallRect(s, 4.3, 0.75, 5.2, 1.35);
  s.fillStyle = '#d7d9dc'; s.fillRect(px, py, pw, ph);
  s.fillStyle = lin(s, px, py, px + pw, py + ph, [[0, '#2b2e33'], [0.5, '#5c636b'], [1, '#1e2024']]);
  s.fillRect(px + 2, py + 2, pw - 4, ph - 4);
}

// Oclusión ambiental: esquinas más oscuras
{
  const [x, y, w, h] = wallRect(s, -HALF_W, FLOOR_Y, HALF_W, CEIL_Y);
  s.fillStyle = lin(s, 0, y + h - 40, 0, y + h, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,.65)']]);
  s.fillRect(x, y + h - 40, w, 40);
  s.fillStyle = lin(s, x, 0, x + 60, 0, [[0, 'rgba(0,0,0,.7)'], [1, 'rgba(0,0,0,0)']]);
  s.fillRect(x, y, 60, h);
  s.fillStyle = lin(s, x + w - 60, 0, x + w, 0, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,.7)']]);
  s.fillRect(x + w - 60, y, 60, h);
}

// =====================================================================
// 2. LED hexagonales del techo
// =====================================================================
const GRID = { x0: -5.2, x1: 5.2, z0: 1.6, z1: 7.2 };
function clip([ax, az], [bx, bz]) {
  let t0 = 0, t1 = 1;
  const dx = bx - ax, dz = bz - az;
  for (const [p, q] of [[-dx, ax - GRID.x0], [dx, GRID.x1 - ax], [-dz, az - GRID.z0], [dz, GRID.z1 - az]]) {
    if (p === 0) { if (q < 0) return null; continue; }
    const t = q / p;
    if (p < 0) { if (t > t1) return null; if (t > t0) t0 = t; } else { if (t < t0) return null; if (t < t1) t1 = t; }
  }
  return [[ax + t0 * dx, az + t0 * dz], [ax + t1 * dx, az + t1 * dz]];
}
const segments = [];
const R = 0.6, HX = 1.5 * R, HZ = Math.sqrt(3) * R;
for (let i = -10; i <= 10; i++) {
  for (let j = -2; j <= 8; j++) {
    const cx = i * HX, cz = GRID.z0 + j * HZ + (i % 2 ? HZ / 2 : 0);
    const pts = Array.from({ length: 6 }, (_, k) => [cx + R * Math.cos((Math.PI / 3) * k), cz + R * Math.sin((Math.PI / 3) * k)]);
    for (let k = 0; k < 6; k++) {
      const sg = clip(pts[k], pts[(k + 1) % 6]);
      if (sg) segments.push(sg);
    }
  }
}
for (const sg of [[[GRID.x0, GRID.z0], [GRID.x1, GRID.z0]], [[GRID.x0, GRID.z1], [GRID.x1, GRID.z1]], [[GRID.x0, GRID.z0], [GRID.x0, GRID.z1]], [[GRID.x1, GRID.z0], [GRID.x1, GRID.z1]]]) segments.push(sg);

function tubes(y, width = 0.032) {
  const [t, k] = layer();
  k.lineCap = 'round';
  k.strokeStyle = '#ffffff';
  for (const [[ax, az], [bx, bz]] of segments) {
    const [x0, y0] = P(ax, y, az), [x1, y1] = P(bx, y, bz);
    k.lineWidth = width * F / ((az + bz) / 2);
    k.beginPath(); k.moveTo(x0, y0); k.lineTo(x1, y1); k.stroke();
  }
  return t;
}
const led = tubes(CEIL_Y);
// La luz de los tubos ilumina el techo alrededor
blit(s, led, { blur: 40, alpha: 0.55 });

// =====================================================================
// 3. Suelo de hormigón pulido con reflejos
// =====================================================================
const [floor, f] = layer();
poly(f, floorPoly, lin(f, 0, WALL_BOTTOM, 0, H, [[0, '#262729'], [0.15, '#2f3032'], [0.45, '#222325'], [1, '#0e0e0f']]));
// Manchas suaves del hormigón
f.save();
f.beginPath(); floorPoly.forEach(([x, y], i) => (i ? f.lineTo(x, y) : f.moveTo(x, y))); f.closePath(); f.clip();
for (let i = 0; i < 260; i++) {
  const x = rnd() * W, y = WALL_BOTTOM + rnd() * (H - WALL_BOTTOM);
  const depth = (y - VY) / 600;
  const r = 10 + rnd() * 70 * depth;
  const gr = f.createRadialGradient(x, y, 0, x, y, r);
  const a = 0.05 + rnd() * 0.06;
  gr.addColorStop(0, rnd() > 0.5 ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a})`);
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  f.fillStyle = gr;
  f.beginPath(); f.ellipse(x, y, r * 1.8, r * 0.5, 0, 0, Math.PI * 2); f.fill();
}
f.restore();

// Reflejo: la pared del fondo vista en el suelo (simetría respecto a la junta pared-suelo)
const [mirror, m] = layer();
m.save();
m.setTransform(1, 0, 0, -1, 0, 2 * WALL_BOTTOM * S);
m.drawImage(scene, 0, 0);
m.restore();
// Los LED reflejados en el suelo (simétricos respecto al plano del suelo)
blit(m, tubes(2 * FLOOR_Y - CEIL_Y), { alpha: 1 });
// Desvanecido del reflejo hacia la cámara
m.save();
m.globalCompositeOperation = 'destination-in';
m.fillStyle = lin(m, 0, WALL_BOTTOM, 0, H, [[0, 'rgba(0,0,0,1)'], [0.35, 'rgba(0,0,0,.55)'], [1, 'rgba(0,0,0,.15)']]);
m.fillRect(0, WALL_BOTTOM, W, H - WALL_BOTTOM);
m.restore();
f.save();
f.beginPath(); floorPoly.forEach(([x, y], i) => (i ? f.lineTo(x, y) : f.moveTo(x, y))); f.closePath(); f.clip();
blit(f, mirror, { blur: 6, alpha: 0.42, op: 'screen' });
blit(f, mirror, { blur: 22, alpha: 0.25, op: 'screen' });
f.restore();

// =====================================================================
// 4. Composición final
// =====================================================================
g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(scene, 0, 0); g.restore();
g.save();
g.beginPath(); floorPoly.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.clip();
g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(floor, 0, 0);
g.restore();
// Junta pared-suelo
g.fillStyle = lin(g, 0, WALL_BOTTOM - 2, 0, WALL_BOTTOM + 10, [[0, 'rgba(0,0,0,.8)'], [1, 'rgba(0,0,0,0)']]);
g.fillRect(0, WALL_BOTTOM - 2, W, 12);
// LED con resplandor (bloom)
blit(g, led, { blur: 30, alpha: 0.7, op: 'screen' });
blit(g, led, { blur: 10, alpha: 0.8, op: 'screen' });
blit(g, led, { blur: 2.5, alpha: 0.9, op: 'screen' });
blit(g, led, { alpha: 1 });

// Viñeta: arriba y abajo se funde con el negro de la web; bordes laterales algo más oscuros
g.fillStyle = lin(g, 0, 0, 0, 760, [[0, '#000'], [1, 'rgba(0,0,0,0)']]);
g.fillRect(0, 0, W, 760);
g.fillStyle = lin(g, 0, H - 760, 0, H, [[0, 'rgba(0,0,0,0)'], [1, '#000']]);
g.fillRect(0, H - 760, W, 760);
{
  const v = g.createRadialGradient(VX, VY, 300, VX, VY, 1100);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

// Grano fino (aspecto fotográfico, evita bandas en los degradados)
{
  const img = g.getImageData(0, 0, c.width, c.height);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rnd() - 0.5) * 7;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  g.putImageData(img, 0, 0);
}
document.title = 'listo';
</script>
