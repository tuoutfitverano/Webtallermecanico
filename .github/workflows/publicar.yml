# Versión REAL de la web (Cloudflare Workers + Supabase). Solo se lanza a mano
# (Actions → «Publicar versión real» → Run workflow) y hay que escribir PUBLICAR.
# Instrucciones y secretos necesarios: docs/PUBLICAR.md.
name: Publicar versión real

on:
  workflow_dispatch:
    inputs:
      paso:
        description: '1 = publicar la web y la base de datos · 2 = crear el taller y hacerte propietario'
        type: choice
        options: ['1-publicar', '2-crear-taller']
        default: '1-publicar'
      correo_propietario:
        description: 'Solo para el paso 2: el correo con el que te registraste en la web'
        required: false
      confirmar:
        description: 'Escribe PUBLICAR para confirmar (cambia la web y la base de datos reales)'
        required: true

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Confirmación
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          if [ "$CONFIRMAR" != "PUBLICAR" ]; then
            echo "::error::No se ha confirmado: escribe PUBLICAR en el campo «confirmar»."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Paso 1 · Publicar la web y la base de datos
        if: inputs.paso == '1-publicar'
        run: bash scripts/publicar/publicar.sh
      - name: Paso 2 · Crear el taller y hacerte propietario
        if: inputs.paso == '2-crear-taller'
        env:
          CORREO_PROPIETARIO: ${{ inputs.correo_propietario }}
        run: bash scripts/publicar/crear-taller.sh
